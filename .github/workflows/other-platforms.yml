name: Windows, Linux, Mac, iPhone and iPad

# Builds OpenAide for every platform other than Android. Linux builds on
# Joel's PC (the same runner as build.yml); Windows, Mac and iPhone/iPad
# need those systems, so they use GitHub's servers, kept to as few runs as
# possible. It only runs when someone starts it: the Run workflow button on
# the Actions tab, or a push whose commit message contains
# [build other platforms]. The Android app is checked by build.yml.
#
# Windows, Linux and Mac builds can be attached to an existing release (the
# Android one with the same version), where the app's update check finds
# them. Without an Apple Developer account the Mac app is ad-hoc signed and
# the iPhone/iPad app is an unsigned .ipa for AltStore / SideStore, with an
# altstore.json source attached next to it (see PLATFORMS.md).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the builds to this existing release (e.g. v0.1.272). Empty = just test builds.
        type: string
        default: ''
  push:
    branches-ignore: [Main-Repository]

concurrency:
  group: other-platforms-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Sign-in registrations, as in build.yml. Empty keeps that sign-in hidden.
  NEXUS_GITHUB_CLIENT_ID: ${{ vars.NEXUS_GITHUB_CLIENT_ID }}
  NEXUS_MICROSOFT_CLIENT_ID: ${{ vars.NEXUS_MICROSOFT_CLIENT_ID }}
  NEXUS_GOOGLE_CLIENT_ID: ${{ vars.NEXUS_GOOGLE_CLIENT_ID }}
  NEXUS_GOOGLE_CLIENT_SECRET: ${{ vars.NEXUS_GOOGLE_CLIENT_SECRET || secrets.NEXUS_GOOGLE_CLIENT_SECRET }}

jobs:
  version:
    # A plain push builds nothing unless its message asks for it.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build other platforms]') }}
    runs-on: [self-hosted, nexus-build]
    outputs:
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$TAG" ]; then
            BUILD="${TAG#v0.1.}"
            case "$BUILD" in (*[!0-9]*|'') echo "::error::Release tags look like v0.1.272, not $TAG"; exit 1;; esac
          else
            # Test builds: a number above every release, so they never
            # look older than the version installed.
            BUILD=$((90000 + ${{ github.run_number }}))
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Joel's PC (WSL Ubuntu), one job at a time like the Android builds.
    runs-on: [self-hosted, nexus-build]
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit (v2.23.0), as in build.yml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      # Installed once on the PC by hand (the runner has no sudo):
      # sudo apt-get install ninja-build libgtk-3-dev libsecret-1-dev
      #   libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Check the Linux build tools
        run: |
          for p in gtk+-3.0 libsecret-1 gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0; do
            pkg-config --exists "$p" || MISSING="$MISSING $p"
          done
          command -v ninja >/dev/null || MISSING="$MISSING ninja"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing on this PC:$MISSING. Install: sudo apt-get install ninja-build libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
            exit 1
          fi
      - run: flutter pub get
      - name: Build
        run: |
          flutter build linux --release \
            --build-name=0.1.${{ needs.version.outputs.build }} \
            --build-number=${{ needs.version.outputs.build }} \
            --dart-define=NEXUS_GITHUB_CLIENT_ID="$NEXUS_GITHUB_CLIENT_ID" \
            --dart-define=NEXUS_MICROSOFT_CLIENT_ID="$NEXUS_MICROSOFT_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_ID="$NEXUS_GOOGLE_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_SECRET="$NEXUS_GOOGLE_CLIENT_SECRET"
          NAME="OpenAide-linux-x64-0.1.${{ needs.version.outputs.build }}"
          mv build/linux/x64/release/bundle "$NAME"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: OpenAide-linux-*.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=0.1.${{ needs.version.outputs.build }} \
            --build-number=${{ needs.version.outputs.build }} \
            --dart-define=NEXUS_GITHUB_CLIENT_ID="$NEXUS_GITHUB_CLIENT_ID" \
            --dart-define=NEXUS_MICROSOFT_CLIENT_ID="$NEXUS_MICROSOFT_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_ID="$NEXUS_GOOGLE_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_SECRET="$NEXUS_GOOGLE_CLIENT_SECRET"
      - name: Zip
        shell: pwsh
        run: |
          $name = "OpenAide-windows-x64-0.1.${{ needs.version.outputs.build }}"
          Rename-Item build/windows/x64/runner/Release $name
          Compress-Archive -Path "build/windows/x64/runner/$name" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OpenAide-windows-*.zip

  apple:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for Mac
        run: |
          flutter build macos --release \
            --build-name=0.1.${{ needs.version.outputs.build }} \
            --build-number=${{ needs.version.outputs.build }} \
            --dart-define=NEXUS_GITHUB_CLIENT_ID="$NEXUS_GITHUB_CLIENT_ID" \
            --dart-define=NEXUS_MICROSOFT_CLIENT_ID="$NEXUS_MICROSOFT_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_ID="$NEXUS_GOOGLE_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_SECRET="$NEXUS_GOOGLE_CLIENT_SECRET"
          APP=build/macos/Build/Products/Release/OpenAide.app
          # Ad-hoc signed (no Apple account): runs on Intel and Apple Silicon
          # Macs once the person allows it in Privacy & Security.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          NAME="OpenAide-macos-0.1.${{ needs.version.outputs.build }}"
          ditto -c -k --keepParent "$APP" "$NAME.zip"
      # Unsigned .ipa: AltStore or SideStore signs it on the person's own
      # iPhone or iPad with their free Apple ID. The App Store and TestFlight
      # need an Apple Developer account.
      - name: Build for iPhone and iPad (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=0.1.${{ needs.version.outputs.build }} \
            --build-number=${{ needs.version.outputs.build }} \
            --dart-define=NEXUS_GITHUB_CLIENT_ID="$NEXUS_GITHUB_CLIENT_ID" \
            --dart-define=NEXUS_MICROSOFT_CLIENT_ID="$NEXUS_MICROSOFT_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_ID="$NEXUS_GOOGLE_CLIENT_ID" \
            --dart-define=NEXUS_GOOGLE_CLIENT_SECRET="$NEXUS_GOOGLE_CLIENT_SECRET"
          V="0.1.${{ needs.version.outputs.build }}"
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qr "../OpenAide-ios-$V.ipa" Payload)
      # The AltStore / SideStore source: people add
      # https://github.com/<repo>/releases/latest/download/altstore.json once
      # and get each new release as an update.
      - name: AltStore source
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          V="0.1.$BUILD"
          IPA="OpenAide-ios-$V.ipa"
          python3 - "$IPA" <<'PY'
          import json, os, sys, datetime
          ipa = sys.argv[1]
          repo, tag, build = os.environ["REPO"], os.environ["TAG"], os.environ["BUILD"]
          owner, name = repo.split("/")
          pages = f"https://{owner.lower()}.github.io/{name}"
          privacy = {
              "NSMicrophoneUsageDescription": "Dictation, voice notes and voice calls.",
              "NSCameraUsageDescription": "Taking photos to send in a chat.",
              "NSPhotoLibraryUsageDescription": "Choosing photos to send in a chat.",
              "NSLocationWhenInUseUsageDescription": "Answering questions about where you are, only when you ask.",
          }
          source = {
              "name": "OpenAide",
              "identifier": "com.eltibu.openaide.source",
              "subtitle": "Open WebUI on your iPhone and iPad",
              "website": pages,
              "iconURL": f"{pages}/logo.png",
              "apps": [{
                  "name": "OpenAide",
                  "bundleIdentifier": "com.eltibu.openaide",
                  "developerName": owner,
                  "subtitle": "Open WebUI on your iPhone and iPad",
                  "localizedDescription": "Chat with your Open WebUI server, or straight with OpenRouter, Claude, OpenAI or Copilot.",
                  "iconURL": f"{pages}/logo.png",
                  "tintColor": "#C96442",
                  "category": "productivity",
                  "versions": [{
                      "version": f"0.1.{build}",
                      "buildVersion": build,
                      "date": datetime.date.today().isoformat(),
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/{ipa}",
                      "size": os.path.getsize(ipa),
                      "minOSVersion": "15.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": privacy},
              }],
              "news": [],
          }
          json.dump(source, open("altstore.json", "w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            OpenAide-macos-*.zip
            OpenAide-ios-*.ipa
            altstore.json


  attach:
    needs: [version, linux, windows, apple]
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: [self-hosted, nexus-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}"
