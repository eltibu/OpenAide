name: Keep signing key

# GitHub drops a cache nobody has read for 7 days. The app's signing key lives
# in the Actions cache, and losing it would force a reinstall on the phone, so
# this reads it every other day to keep it.
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-latest
    # Job-level, so the step's `if` can see it (a step's own env can't).
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      # With a fixed key in secrets the build never uses this cache, so
      # there is nothing to keep.
      - uses: actions/cache/restore@v4
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        with:
          path: ~/.android/debug.keystore
          key: nexus-debug-keystore-v1
          fail-on-cache-miss: true
