name: Build

on:
  push:
    branches: [Main-Repository]
  pull_request:
  workflow_dispatch:
    inputs:
      new_signing_key:
        description: Make a NEW signing key (every phone must uninstall once). Only if the old one is lost.
        type: boolean
        default: false

# One runner (Joel's PC) builds everything, about 30 minutes a build. A new
# push to a branch replaces that branch's older queued or running build.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    # Joel's PC (WSL Ubuntu) runs the builds: GitHub-hosted minutes for this
    # private repo are blocked by billing. It has the Android SDK and JDK 17.
    runs-on: [self-hosted, nexus-build]
    permissions:
      contents: write
    # Job-level, so a step's `if` can test it (a step's own env can't).
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Use the fixed signing key, if configured
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-nexus}
          EOF
      # Without the secrets above, sign with one debug key kept in the Actions
      # cache, so every build has the same signature and installs over the
      # previous one.
      - name: Restore shared debug signing key
        if: ${{ hashFiles('android/key.properties') == '' }}
        id: debugkey
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nexus-debug-keystore-v1
      # A missing key is an error, never a quiet new key: an APK with a new
      # signature can't install over the app, so publishing one would force a
      # reinstall. A new key is made only when asked for by hand.
      - name: Stop if the shared signing key is missing
        if: ${{ hashFiles('android/key.properties') == '' && steps.debugkey.outputs.cache-hit != 'true' && !inputs.new_signing_key }}
        run: |
          echo "::error::The shared signing key is missing from the Actions cache. Not building, so no APK with a different signature is published."
          exit 1
      - name: Create shared debug signing key
        if: ${{ hashFiles('android/key.properties') == '' && steps.debugkey.outputs.cache-hit != 'true' && inputs.new_signing_key }}
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Save shared debug signing key
        if: ${{ hashFiles('android/key.properties') == '' && steps.debugkey.outputs.cache-hit != 'true' && inputs.new_signing_key }}
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nexus-debug-keystore-v1
      # Point Gradle at the shared key explicitly. Left to itself it made a
      # fresh debug key on every runner, so each build had a new signature.
      - name: Sign with the shared debug key
        if: ${{ hashFiles('android/key.properties') == '' }}
        run: |
          # actions/cache stores the file relative to the workspace, so on a
          # runner whose workspace isn't under $HOME (Joel's PC) it lands
          # three levels above the workspace instead.
          if [ ! -f ~/.android/debug.keystore ]; then
            ALT=$(realpath -m "$GITHUB_WORKSPACE/../../../.android/debug.keystore")
            if [ -f "$ALT" ]; then
              mkdir -p ~/.android && cp "$ALT" ~/.android/debug.keystore
            fi
          fi
          cat > android/key.properties <<EOF
          storeFile=$HOME/.android/debug.keystore
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          EOF
      # Versions read 0.1.<run number>. The run number is also the version
      # code, which only goes up; the in-app updater uses it to spot new builds.
      # On failure the build's errors become annotations, readable from the
      # checks API without the raw log.
      # The built-in token must be able to see this repo's releases, or the
      # app can never find an update. Never prints the token.
      - name: Check the update token
        env:
          NEXUS_UPDATE_TOKEN: ${{ secrets.NEXUS_UPDATE_TOKEN }}
        run: |
          if [ -z "$NEXUS_UPDATE_TOKEN" ]; then
            echo "::error::NEXUS_UPDATE_TOKEN is not set."; exit 1
          fi
          CODE=$(curl -s -o releases.json -w '%{http_code}' \
            -H "Authorization: Bearer $NEXUS_UPDATE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=3")
          echo "::notice::Update token check: GitHub answered $CODE, $(grep -c '"tag_name"' releases.json) releases visible"
          if [ "$CODE" != "200" ]; then
            # Why: who the token belongs to, when it expires and what it can
            # see. Status codes and names only, never the token.
            T=$(printf %s "$NEXUS_UPDATE_TOKEN" | tr -d '[:space:]')
            [ "$T" != "$NEXUS_UPDATE_TOKEN" ] && echo "::warning::The secret has spaces or a line break around the token."
            echo "::notice::Token starts with ${T:0:11}, length ${#T}"
            U=$(curl -s -D user.h -o user.json -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/user)
            echo "::notice::/user answered $U as $(grep -m1 '"login"' user.json | tr -d ' ,'); expires: $(grep -i 'github-authentication-token-expiration' user.h | tr -d '\r')"
            R=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.github.com/repos/${{ github.repository }}")
            echo "::notice::Repo lookup answered $R"
            N=$(curl -s -H "Authorization: Bearer $T" "https://api.github.com/user/repos?per_page=100" | grep '"full_name"' | tr -d ' ,' | tr '\n' ' ')
            echo "::notice::Repos the token can see: ${N:-none}"
            rm -f user.h user.json
          fi
          rm -f releases.json
          if [ "$CODE" != "200" ]; then
            echo "::error::The update token can't read releases (HTTP $CODE). The app would never see updates."; exit 1
          fi
      # The on-device AI models (llama.cpp) need the NDK and CMake 3.31.6.
      # The runner's SDK in /opt is read-only for the runner user, so they go
      # in a writable SDK in its home that links to the rest.
      - name: Install NDK and CMake
        run: |
          set -e
          SDK="$HOME/android-sdk"
          if [ ! -w "$ANDROID_HOME" ] && [ "$ANDROID_HOME" != "$SDK" ]; then
            mkdir -p "$SDK"
            for d in "$ANDROID_HOME"/*; do
              n=$(basename "$d")
              case "$n" in ndk|cmake|licenses) ;; *) [ -e "$SDK/$n" ] || ln -s "$d" "$SDK/$n" ;; esac
            done
            mkdir -p "$SDK/licenses" && cp -n "$ANDROID_HOME"/licenses/* "$SDK/licenses/" 2>/dev/null || true
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          else
            SDK="$ANDROID_HOME"
            SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          fi
          NDK=$(grep -rhoE 'ndkVersion[^"]*"[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/" 2>/dev/null | grep -oE '[0-9]+\.[0-9.]+' | head -1)
          PKGS=""
          [ -d "$SDK/cmake/3.31.6" ] || PKGS="$PKGS cmake;3.31.6"
          [ -z "$NDK" ] || [ -d "$SDK/ndk/$NDK" ] || PKGS="$PKGS ndk;$NDK"
          echo "::notice::NDK $NDK; installing:${PKGS:- nothing}"
          if [ -n "$PKGS" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --install $PKGS > /dev/null
          fi
      # The runner on Joel's PC keeps state between builds. A Kotlin daemon
      # left from an earlier build can leave files pointing Gradle at a port
      # nobody listens on, and every build then waits on it. Compile Kotlin
      # inside Gradle and stop any leftover daemons first.
      - name: Compile Kotlin in-process
        run: |
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties
          pkill -u "$(id -u)" -f KotlinCompileDaemon || true
          rm -rf "$HOME/.local/share/kotlin/daemon" "$HOME/.kotlin/daemon" 2>/dev/null || true
      - name: Build APK
        env:
          # Read-only token for the in-app updater (repo secret), so the app
          # never asks for one.
          NEXUS_UPDATE_TOKEN: ${{ secrets.NEXUS_UPDATE_TOKEN }}
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=NEXUS_UPDATE_TOKEN="$NEXUS_UPDATE_TOKEN" 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Exception|FAILURE" -A4 build.log \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      # Re-sign with the Nexus release key. Play Protect treats the generic
      # debug key as untrusted, so the release key replaces it. A signed
      # rotation proof (lineage) from the old key lets Android 9+ install the
      # new builds over the app already on the phone, with no reinstall. The
      # old key keeps the rollback right, so builds still signed with it (other
      # branches) also keep installing over the top.
      - name: Sign with the release key (rotated from the old key)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          prop() { grep "^$1=" android/key.properties | cut -d= -f2-; }
          OLD_KS=$(prop storeFile); OLD_ALIAS=$(prop keyAlias)
          case "$OLD_KS" in /*) ;; *) OLD_KS="android/app/$OLD_KS" ;; esac
          export OLD_STORE_PASS=$(prop storePassword) OLD_KEY_PASS=$(prop keyPassword)
          NEW_KS="$RUNNER_TEMP/nexus-release.p12"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$NEW_KS"
          OLD=(--ks "$OLD_KS" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_STORE_PASS --key-pass env:OLD_KEY_PASS)
          NEW=(--ks "$NEW_KS" --ks-key-alias nexus --ks-pass env:RELEASE_KEY_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD)
          # The proof is made once with both keys. After that it lives in the
          # repo (it holds certificates and signatures, no private key), so
          # the old key is no longer needed to sign.
          LINEAGE=android/signing-lineage.bin
          if [ ! -f "$LINEAGE" ]; then
            LINEAGE="$RUNNER_TEMP/lineage.bin"
            "$APKSIGNER" rotate --out "$LINEAGE.tmp" --old-signer "${OLD[@]}" --new-signer "${NEW[@]}"
            "$APKSIGNER" lineage --in "$LINEAGE.tmp" --out "$LINEAGE" --signer "${OLD[@]}" --set-rollback true
            echo "::notice::New rotation proof; commit it as android/signing-lineage.bin (base64): $(base64 -w0 "$LINEAGE")"
          fi
          "$APKSIGNER" lineage --in "$LINEAGE" --print-certs -v
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign "${NEW[@]}" --lineage "$LINEAGE" \
            --rotation-min-sdk-version 28 --v3-signing-enabled true \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$NEW_KS"
      # The last line of defence: the APK must be signed with the key pinned in
      # android/signing-sha256.txt, or with the release key pinned in
      # android/release-signing-sha256.txt and a rotation proof from the pinned
      # key. Anything else Android refuses as an update.
      - name: Check the APK's signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "::notice::APK signing certificate SHA-256: $ACTUAL"
          EXPECTED=$(tr -d '[:space:]' < android/signing-sha256.txt 2>/dev/null || true)
          RELEASE=$(tr -d '[:space:]' < android/release-signing-sha256.txt 2>/dev/null || true)
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" = "$EXPECTED" ]; then
            exit 0
          fi
          if [ -n "$RELEASE" ] && [ "$ACTUAL" = "$RELEASE" ]; then
            LINEAGE=$("$APKSIGNER" lineage --in "$APK" --print-certs | grep 'SHA-256 digest' | awk '{print $NF}')
            echo "::notice::Rotation proof: $(echo $LINEAGE)"
            if echo "$LINEAGE" | grep -qx "$EXPECTED"; then
              exit 0
            fi
            echo "::error::APK has the release key but no rotation proof from $EXPECTED. Not publishing: it would not install over the app."
            exit 1
          fi
          echo "::error::APK is signed with $ACTUAL, expected $EXPECTED. Not publishing: it would not install over the app."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Each build becomes a GitHub Release tagged v0.1.<run number>; the
      # app's updater installs the newest one.
      - name: Publish build for in-app updates
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nexus-assistant.apk
          gh release create "v0.1.${{ github.run_number }}" nexus-assistant.apk \
            --title "OpenAide 0.1.${{ github.run_number }}" \
            --notes "$NOTES" \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --latest
